<body class="cx-body">
<main class="cx">
  <section class="cx-left">
    <a class="cx-home" href="/">PregNut</a>
    <h1>Contact <em>us</em></h1>
    <p class="cx-sub">Ready to start? Let&rsquo;s chat.</p>
    <form class="cx-form" data-contact novalidate>
      <div class="cx-row">
        <div class="cx-field"><label for="cx-first">First name</label><input id="cx-first" name="first" autocomplete="given-name" maxlength="50" placeholder="First name"></div>
        <div class="cx-field"><label for="cx-last">Last name</label><input id="cx-last" name="last" autocomplete="family-name" maxlength="50" placeholder="Last name"></div>
      </div>
      <div class="cx-field"><label for="cx-email">Email</label><input id="cx-email" name="email" type="email" required autocomplete="email" maxlength="200" placeholder="you@example.com"></div>
      <div class="cx-field"><label for="cx-loc">Location</label><div class="cx-select"><span class="cx-flag" aria-hidden="true"></span><select id="cx-loc" name="location" autocomplete="country-name"></select></div></div>
      <div class="cx-field"><label for="cx-msg">Message</label><textarea id="cx-msg" name="message" required maxlength="3000" rows="5" placeholder="How can we help?"></textarea></div>
      <input class="cx-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="cx-btn" type="submit">Contact</button>
      <p class="cx-mail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg><a href="mailto:admin@yuriystasyuk.com">admin@yuriystasyuk.com</a></p>
      <p class="cx-status" role="status" aria-live="polite"></p>
      <p class="cx-note">Not for medical questions. For your own pregnancy, ask your clinician or midwife.</p>
    </form>
  </section>
  <aside class="cx-right" aria-hidden="true">
    <div class="cx-guides"><i class="v1"></i><i class="v2"></i><i class="h1"></i><i class="h2"></i></div>
    <div class="cx-tablet"><img src="/resource/contact-tablet.webp" alt="" width="1280" height="960" loading="eager" decoding="async"></div>
  </aside>
</main>
